{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block page_content %}
<div class="row">
    <div class="col-md-4 col-md-offset-4">
        {% if add_account %}
            <h2 class="form-signin-heading">添加新账号</h2>
            <p class="text-muted">当前已登录 {{ logged_in_users|length }} 个账号，最多支持3个</p>
        {% else %}
            <h2 class="form-signin-heading">请登录</h2>
        {% endif %}
        {{ wtf.quick_form(form, form_type="horizontal") }}
        {% if add_account %}
            <div style="margin-top: 15px;">
                <a href="{{ url_for('show_todo_list') }}" class="btn btn-default">返回</a>
            </div>
        {% endif %}
    </div>
</div>
{% endblock %}
