{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block page_content %}
<div class="row">
    <div class="col-md-4 col-md-offset-4">
        <h2 class="form-signin-heading">please sigin in</h2>
        {{ wtf.quick_form(form, form_type="horizontal") }}
        
        <div class="text-center" style="margin-top: 20px;">
            <p>Don't have an account? <a href="#registerModal" data-toggle="modal">Register</a></p>
        </div>
    </div>
</div>

<!-- Register Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" role="dialog" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal"><span aria-hidden="true">&times;</span><span class="sr-only">Close</span></button>
        <h4 class="modal-title" id="registerModalLabel" align="center">Register</h4>
      </div>
      <div class="modal-body">
        <div class="row">
            <div class="col-md-8 col-md-offset-2"> 
                <form action="{{ url_for('register') }}" method="post">
                    {{ register_form.csrf_token }}
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <div class="form-group">
                        <label for="password_confirm">Confirm Password</label>
                        <input type="password" class="form-control" id="password_confirm" name="password_confirm" required>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block">Register</button>
                </form>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
