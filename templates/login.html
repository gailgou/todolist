{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block page_content %}
<div class="row">
    <div class="col-md-4 col-md-offset-4">
        {% if add_account %}
            <h2 class="form-signin-heading">添加登录账号</h2>
            <p class="text-muted">最多可同时登录3个账号</p>
            <a href="{{ url_for('show_todo_list') }}" class="btn btn-default btn-sm">返回</a>
        {% else %}
            <h2 class="form-signin-heading">please sigin in</h2>
        {% endif %}
        {{ wtf.quick_form(form, form_type="horizontal") }}
    </div>
</div>
{% endblock %}
