{% extends "base.html" %}
{% import "bootstrap/wtf.html" as wtf %}

{% block page_content %}
<div class="row">
    <div class="col-md-4 col-md-offset-4">
        <h2 class="form-signin-heading">用户注册</h2>
        {{ wtf.quick_form(form, form_type="horizontal") }}

            <a href="{{ url_for('login') }}">已有账号？点击登录</a>
        </p>
    </div>
</div>
{% endblock %}
